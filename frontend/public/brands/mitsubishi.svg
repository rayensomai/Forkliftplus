<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Mitsubishi Forklift Trucks">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="900" height="260" rx="28" fill="url(#bg)" stroke="#e2e8f0"/>
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="64" font-weight="900"
        fill="#0f172a">Mitsubishi</text>
  <text x="50%" y="72%" text-anchor="middle" dominant-baseline="middle"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="34" font-weight="700"
        fill="#334155">Forklift Trucks</text>
